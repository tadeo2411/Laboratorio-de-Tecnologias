<main class = "contenido">
            <section class = "contenedor">
                <h2 class="titContenedor">Nuevo vehículo</h2>
                    <form>
                        <div class="formulario anchoComp">
                            <label for="dueno">Dueño</label>
                            <select id="dueno">
                                <option>---elegir---</option>
                            </select>
                        </div>
                        <div class="grilla">
                            <div class="formulario">
                                <label>patente</label>
                                <input type="text" placeholder="AA000AA">
                            </div>
                            <div class="formulario">
                                <label>marca</label>
                                <input type="text">
                            </div>
                            <div class="formulario">
                                <label>Modelo</label>
                                <input type="text">
                            </div>
                        </div>
                        <div class="formulario">
                            <label>Año</label>
                            <input type="text">
                        </div>
                        <div class="formulario">
                            <label>Kilometraje</label>
                            <input type="text">
                        </div>
                        <div class="formulario anchoComp">
                            <label>Observaciones</label>
                            <textarea rows="3"></textarea>
                        </div>
                        <button type="submit" class="btnGuardar">Guardar</button>
                    </form>
            </section>
            <section class="contenedor">
                <div>
                    <h2 class="titContenedor">Vehículos</h2>
                    <input type="text" class="input-busqueda" placeholder="Buscar por patente, marca o modelo...">
                </div>
                <div class="formatoTabla">
                    <table class="datosTabla">
                        <thead>
                            <tr>
                                <th>Patente</th>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Año</th>
                                <th>Kilometraje</th>

                                <th>Observaciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="7" class="sinDatos">Todavía no hay vehículos cargados.</td>
                            </tr>
                        </tbody>
                    </table>
