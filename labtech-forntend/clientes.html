<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel ="icon" href="public\images\logo-303mei.jpg">
    <script src="js\navBar-collapse.js" defer></script>
    <title>Clientes</title>
</head>
<body>
    <header>
        <img src="public\images\logo-303mei.jpg" alt="Logo" height="100px" width="100px">
        
        <!-- Botón que solo aparecerá en móviles -->
        <button class="btn-menu" id="btnMenu"></button>
        
        <nav>
            <!-- Agregamos un id para controlarlo con JavaScript -->
            <ul class="barra" id="menuNavegacion">
                <li><a href="index.html" class = "hoverNavBar">Tableros</a></li>
                <li><a href="ordenes.html" class = "hoverNavBar">Ordenes</a></li>
                <li><a href="turnos.html" class = "hoverNavBar">Turnos</a></li>
                <li><a href="presupuestos.html" class = "hoverNavBar">Presupuestos</a></li>
                <li><a href="clientes.html" class = "hoverNavBar">Clientes</a></li>
                <li><a href="vehiculos.html" class = "hoverNavBar">Vehículos</a></li>
                <li><a href="repuestos.html" class = "hoverNavBar">Repuestos</a></li>
            </ul>
        </nav>
        

    </header>
    <main class = "contenido">
        <section class = "contenedor">
            <h2 class="titContenedor">Nuevo cliente</h2>
            <form class="grilla grilla-clientes">
                <div class="formulario">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre">
                </div>
                <div class="formulario">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Apellido">
                </div>
                <div class="formulario">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" placeholder="Teléfono">
                </div>
                <div class="formulario">
                    <label for="idDoc">DNI / CUIT</label>
                <input type = "text" id="idDoc" placeholder="DNI / CUIT">
                </div>
                <button type="submit" class="btnGuardar">Guardar</button>
            </form>
        </section>
        <section class = "contenedor">
            <h2 class="titContenedor">Clientes</h2>
            <input type="search" class="input-busqueda" placeholder="Buscar por DNI / CUIT">
            <div class = "formatoTabla">
                <table class = "datosTabla">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Teléfono</th>
                            <th>DNI / CUIT</th>
                        </tr>
                    </thead>
                    <tbody id = "idTabla">
                        <tr>
                            <td colspan="4" class="sinDatos">Todavía no hay clientes cargados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
