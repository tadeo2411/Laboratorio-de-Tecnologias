<body>
    <header>
    <img src="public\images\logo-303mei.jpg" alt="Logo" height="100px" width="100px">
    
    <!-- Botón que solo aparecerá en móviles -->

            <li><a href="presupuestos.html" class ="hoverNavBar">Presupuestos</a></li>

            <li><a href="repuestos.html" class ="hoverNavBar">Repuestos</a></li>
        </ul>
    </nav>  
</header>
    <main class="contenido">
        <section class="contenedor">
            <div>
                <h2 class="titContenedor">Abrir una orden</h2>
            </div>
            <form>
                <div class="formulario anchoComp">
                    <label for="dueno">Vehículo</label>
                    <select id="dueno">
                        <option>---elegir---</option>
                    </select>
                </div>
                <div class="formulario anchoComp">
                    <label for="dueno">Tipo</label>
                    <select id="dueno">
                        <option>---elegir---</option>
                    </select>
                </div>
                <div class="formulario anchoComp">
                    <label for="dueno">Kilometraje al entrar</label>
                    <input type="number">
                </div>

                </div>
                <div class="formulario">
                    <label>¿Por qué viene?</label>
                    <input type="text">
                </div>
            </form>
            <div><button type="submit" class="btnGuardar">Guardar</button></div>
        </section>



        <div class="separadorSection">
            <section class="contenedor">
                <div>
                    <h2 class="titContenedor">En el taller ahora</h2>
                </div>
                <div class="formatoTabla">
                    <table class="datosTabla">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>VEHÍCULO</th>
                                <th>ESTADO</th>
                                <th>DESDE</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="7" class="sinDatos">Todavía no hay vehículos cargados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <section class="contenedor">
                <p class="sinDatos">Elegí una orden de la lista para ver el detalle.</p>
            </section>
        </div>
