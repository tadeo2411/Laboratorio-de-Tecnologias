<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="public/images/logo-303mei.jpg">
</head>
<body>
    <header>
    <img src="public/images/logo-303mei.jpg" alt="Logo" height="100px" width="100px">
    <nav>
        <ul class ="barra">
            <li><a href="index.html">Tableros</a></li>
            <li><a href="ordenes.html">Ordenes</a></li>
            <li><a href="turnos.html">Turnos</a></li>
            <li><a href="presupuestos.html">Presupuestos</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="vehiculos.html">Vehículos</a></li>
            <li><a href="repuestos.html">Repuestos</a></li>
        </ul>
    </nav>
    <div>
    <p>Bienvenido, </p>
    </div>
<a href="login.html">Salir</a>
</header>
    <main class = "contenido">
        <section class = "contenedor">
            <h2 class="titContenedor">Nuevo presupuesto</h2>
            <form class="grilla grilla-presupuesto">
                <div class = "formulario">
                    <label for = "idOrden">Orden de trabajo:</label>
                    <select name = "Orden de trabajo" id = "idOrden">
                        <option value = "">Elegir</option>
                    </select>
                </div>
                <div class="formulario">
                    <label for="idObs">Observaciones</label>
                    <textarea name="Observaciones" id="idObs" cols="30" rows="5"></textarea>
                </div>
                <button type="submit" class="btnGuardar">Guardar presupuesto</button>
            </form>
        </section>
        <section class="contenedor">
            <h2 class="titContenedor">Presupuestos</h2>
            <input type="search" class="input-busqueda" placeholder="Buscar por número o estado">
            <div class="formatoTabla">
                <table class="datosTabla">
                    <thead>
                        <tr>
                            <th>Numero</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="idTabla">
                        <tr>
                            <td colspan="4" class="sinDatos">Todavía no hay presupuestos cargados.</td>
                        </tr>
                    </tbody>
                </table>
            
            </div>
        </section>
    </main>
</body>
</html>
