<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="public/images/logo-303mei.jpg">
    <script src="js\navBar-collapse.js" defer></script>
</head>
<body>
    <header>
        <img src="public\images\logo-303mei.jpg" alt="Logo" height="100px" width="100px">
        
        <!-- Botón que solo aparecerá en móviles -->
        <button class="btn-menu" id="btnMenu">↓ Presupuestos</button>
        
        <nav>
            <!-- Agregamos un id para controlarlo con JavaScript -->
            <ul class="barra" id="menuNavegacion">
                <li><a href="index.html" class = "hoverNavBar">Tableros</a></li>
                <li><a href="ordenes.html" class = "hoverNavBar">Ordenes</a></li>
                <li><a href="turnos.html" class = "hoverNavBar">Turnos</a></li>
                <li><a href="presupuestos.html" class = "hoverNavBar">Presupuestos</a></li>
                <li><a href="clientes.html" class = "hoverNavBar">Clientes</a></li>
                <li><a href="vehiculos.html" class = "hoverNavBar">Vehículos</a></li>
                <li><a href="repuestos.html" class = "hoverNavBar">Repuestos</a></li>
            </ul>
        </nav>
    </header>
    <main class = "contenido">
        <section class = "contenedor">
            <h2 class="titContenedor">Nuevo presupuesto</h2>
            <form class="grilla grilla-presupuesto" id = "formularioPres">
                <div class = "formulario">
                    <label for = "idOrden">Orden de trabajo:</label>
                    <select name = "Orden de trabajo" id = "idOrden">
                        <option value = "">Elegir</option>
                    </select>
                </div>
                <div class="textos">
                    <label for="idObs">Observaciones</label>
                    <textarea name="Observaciones" id="idObs" cols="30" rows="5"></textarea>
                </div>
                <button type="submit" class="btnGuardar">Guardar presupuesto</button>
            </form>
        </section>
        <section class="contenedor">
            <h2 class="titContenedor">Presupuestos</h2>
            <input type="search" class="input-busqueda" placeholder="Buscar por número o estado">
            <div class="formatoTabla">
                <table class="datosTabla">
                    <thead>
                        <tr>
                            <th>Numero</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="idTabla">
                        <tr>
                            <td colspan="4" class="sinDatos">Todavía no hay presupuestos cargados.</td>
                        </tr>
                    </tbody>
                </table>
            
            </div>
        </section>
    </main>
</body>
</html>
