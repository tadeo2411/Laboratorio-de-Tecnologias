<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel ="icon" href="public\images\logo-303mei.jpg">
    <script src="js\navBar-collapse.js" defer></script>
    <title>Repuestos</title>
</head>
<body>
    <header>
    <img src="public\images\logo-303mei.jpg" alt="Logo" height="100px" width="100px">
    
    <!-- Botón que solo aparecerá en móviles -->
    <button class="btn-menu" id="btnMenu"></button>

    <nav>
        <!-- Agregamos un id para controlarlo con JavaScript -->
        <ul class="barra" id="menuNavegacion">
            <li><a href="index.html" class ="hoverNavBar">Tableros</a></li>
            <li><a href="ordenes.html" class ="hoverNavBar">Ordenes</a></li>
            <li><a href="turnos.html" class ="hoverNavBar">Turnos</a></li>
            <li><a href="presupuestos.html" class ="hoverNavBar">Presupuestos</a></li>
            <li><a href="clientes.html" class ="hoverNavBar">Clientes</a></li>
            <li><a href="vehiculos.html" class ="hoverNavBar">Vehículos</a></li>
            <li><a href="repuestos.html" class ="hoverNavBar">Repuestos</a></li>
        </ul>
    </nav>


</header>
<main class="contenido">
    <section class="contenedor">
        <h2 class="titContenedor">Nuevo repuesto</h2>
        <form>
            <div class="grilla">
                <div class="formulario">
                    <label>Codigo</label>
                    <input type="text">
                </div>
                <div class="formulario">
                    <label>Nombre</label>
                    <input type="text">
                </div>
                <div class="formulario">
                    <label>Precio de costo</label>
                    <input type="text">
                </div>
                <div class="formulario">
                    <label>Precio de venta</label>
                    <input type="text">
                </div>
                <div class="formulario">
                    <label>Stock</label>
                    <input type="text">
                </div>
                <div class="formulario">
                    <label>Stock</label>
                    <input type="text">
                </div>
                <div class="formulario">
                    <label>Stock mínimo</label>
                    <input type="text">
                </div>
                <div class="formulario anchoComp">
                    <label>Descripción</label>
                    <textarea></textarea>
                </div>
            </div>
            <div class="botonGuardar">
            <button type="submit" class="btnGuardar">Guardar</button>
            </div>
        </form>
        
    </section>
    <section class="contenedor">
        <div>
            <h2 class="titContenedor">Vehículos</h2>
            <input type="text" class="input-busqueda" placeholder="Buscar por patente, marca o modelo...">
        </div>
        <div class="formatoTabla">
            <table class="datosTabla">
                <thead>
                    <tr>
                        <th></th>
                            <th>Codigo</th>
                            <th>Nombre</th>
                            <th>Precio de costo</th>
                            <th>Precio de venta</th>
                            <th>Stock</th>
                            <th>Stock mínimo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="sinDatos">Todavía no hay vehículos cargados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</body>

</html>
