$kind: collection
description: |-
  Backend del taller. Ejecutar la coleccion completa con el Collection Runner: el primer
  request (1. Auth / Login 200) guarda el token en la variable de coleccion {{token}} y
  todos los demas lo usan por herencia. Para repetir la corrida con los mismos datos,
  volver a cargar database/seed_postman.sql.
variables:
  - key: baseUrl
    value: http://localhost:3000/api
    disabled: false
  - key: usuario
    value: admin
    disabled: false
  - key: contrasena
    value: Admin303!
    disabled: false
  - key: token
    secret: true
    disabled: false
  - key: patenteExistente
    value: ""
    disabled: false
  - key: clienteDocumento
    value: ""
    disabled: false
  - key: clienteNuevoId
    value: ""
    disabled: false
auth:
  - id: b7e6b500-f83a-4cc7-9d9d-46bd490835ad
    type: bearer
    name: bearer auth
    credentials:
      token: "{{token}}"
