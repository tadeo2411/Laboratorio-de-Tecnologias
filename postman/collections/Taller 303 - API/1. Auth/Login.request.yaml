$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuario": "{{usuario}}",
      "contrasena": "{{contrasena}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          pm.collectionVariables.set('token', pm.response.json().token)
      }
    language: text/javascript
order: 1000
