$kind: http-request
url: "{{baseUrl}}/ordenes/{{ordenId}}/trabajos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipoTrabajoId": 1,
      "descripcion": "Cambio de aceite",
      "empleadoIds": [
        2
      ],
      "repuestos": [
        {
          "repuestoId": 1,
          "cantidad": 2
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          pm.collectionVariables.set('trabajoId', pm.response.json().trabajos.at(-1).id)
      }
    language: text/javascript
order: 8000
