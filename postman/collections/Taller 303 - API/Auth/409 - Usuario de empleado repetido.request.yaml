$kind: http-request
url: '{{baseUrl}}/auth/empleados'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "Administrador",
      "usuario": "{{usuario}}",
      "contrasena": "12345678",
      "rol": "ADMINISTRADOR"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 409', () => pm.response.to.have.status(409))
    language: text/javascript
order: 6000
