$kind: http-request
url: '{{baseUrl}}/auth/empleados'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "Empleado de prueba",
      "usuario": "{{empleadoUsuario}}",
      "contrasena": "prueba12345",
      "rol": "MECANICO"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('empleadoUsuario', 'emp' + String(Date.now()).slice(-8))
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201))
    language: text/javascript
order: 5000
