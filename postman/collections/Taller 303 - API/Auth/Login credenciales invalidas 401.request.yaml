$kind: http-request
url: '{{baseUrl}}/auth/login'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "usuario": "{{usuario}}",
      "contrasena": "incorrecta"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 401', () => pm.response.to.have.status(401))
    language: text/javascript
order: 7000
