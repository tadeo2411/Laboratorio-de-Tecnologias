$kind: http-request
url: '{{baseUrl}}/auth/perfil'
method: GET
headers:
  - key: Authorization
    value: 'Bearer token.invalido'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 401', () => pm.response.to.have.status(401))
    language: text/javascript
order: 9000
