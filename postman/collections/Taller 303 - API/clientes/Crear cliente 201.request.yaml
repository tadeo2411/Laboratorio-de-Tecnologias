$kind: http-request
url: '{{baseUrl}}/clientes'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "documento": "{{clienteDocumento}}",
      "tipo": "PERSONA",
      "nombre": "Cliente de prueba",
      "telefono": "2665298838"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('clienteDocumento', String(Date.now()).slice(-8))
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201))
      if (pm.response.code < 300) {
          pm.collectionVariables.set('clienteNuevoId', pm.response.json().id)
      }
    language: text/javascript
order: 2000
