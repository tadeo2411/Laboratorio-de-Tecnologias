$kind: http-request
url: "{{baseUrl}}/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "documento": "12abc",
      "tipo": "PERSONA",
      "nombre": "Cliente de prueba",
      "telefono": "hola"
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 400', () => pm.response.to.have.status(400))
    language: text/javascript
order: 4000
