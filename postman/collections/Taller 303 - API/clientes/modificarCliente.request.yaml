$kind: http-request
url: "{{baseUrl}}/clientes/:id"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: "5"
    description: ""
body:
  type: json
  content: |-
    {
      "nombre": "Cliente modificado",
      "telefono": "1122334499"
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 200', () => pm.response.to.have.status(200))
    language: text/javascript
order: 8000
