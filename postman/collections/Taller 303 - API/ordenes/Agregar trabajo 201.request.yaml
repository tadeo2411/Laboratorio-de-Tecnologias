$kind: http-request
url: '{{baseUrl}}/ordenes/{{ordenId}}/trabajos'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "tipoTrabajoId": 1,
      "descripcion": "Cambio de aceite",
      "empleadoIds": [
        2
      ],
      "repuestos": [
        {
          "repuestoId": 1,
          "cantidad": 2
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201))
      if (pm.response.code < 300) {
          pm.collectionVariables.set('trabajoId', pm.response.json().trabajos.at(-1).id)
      }
    language: text/javascript
order: 8000
