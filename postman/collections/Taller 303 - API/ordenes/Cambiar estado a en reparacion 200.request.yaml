$kind: http-request
url: '{{baseUrl}}/ordenes/{{ordenId}}/estado'
method: PATCH
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "estado": "EN_REPARACION"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200))
    language: text/javascript
order: 11000
