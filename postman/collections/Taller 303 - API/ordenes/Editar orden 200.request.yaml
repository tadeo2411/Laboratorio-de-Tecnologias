$kind: http-request
url: '{{baseUrl}}/ordenes/{{ordenId}}'
method: PATCH
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "diagnostico": "Cambio de aceite y filtros",
      "esUrgencia": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200))
    language: text/javascript
order: 6000
