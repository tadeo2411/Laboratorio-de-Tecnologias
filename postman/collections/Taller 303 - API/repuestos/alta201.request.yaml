$kind: http-request
url: '{{baseUrl}}/repuestos'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "{{repuestoNombre}}",
      "precio_estandar": "99123.00",
      "activo": true
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('repuestoNombre', 'Repuesto de prueba ' + Date.now())
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201))
      if (pm.response.code < 300) {
          pm.collectionVariables.set('repuestoNuevoId', pm.response.json().id)
      }
    language: text/javascript
order: 2000
