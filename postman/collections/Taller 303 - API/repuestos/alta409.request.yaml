$kind: http-request
url: '{{baseUrl}}/repuestos'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "{{repuestoNombre}}",
      "precio_estandar": "99123.00",
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 409', () => pm.response.to.have.status(409))
    language: text/javascript
order: 3000
