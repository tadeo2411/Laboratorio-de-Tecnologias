$kind: http-request
url: '{{baseUrl}}/repuestos/{{repuestoNuevoId}}'
method: PATCH
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "{{repuestoNombre}}",
      "precio_estandar": "999999.00",
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200))
    language: text/javascript
order: 7000
