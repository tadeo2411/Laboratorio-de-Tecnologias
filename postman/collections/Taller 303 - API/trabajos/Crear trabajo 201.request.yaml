$kind: http-request
url: '{{baseUrl}}/trabajos'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "orden_id": {{ordenId}},
      "tipo_trabajo_id": 1,
      "descripcion": "Realizar cambio de aceite y filtros",
      "mano_de_obra": "22000.00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201))
      if (pm.response.code < 300) {
          pm.collectionVariables.set('trabajoNuevoId', pm.response.json().id)
      }
    language: text/javascript
order: 2000
