$kind: http-request
url: '{{baseUrl}}/trabajos'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "Trabajo de prueba {{$timestamp}}",
      "categoria": "MANTENIMIENTO",
      "precio_estandar": "22000.00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201))
      if (pm.response.code < 300) {
          pm.collectionVariables.set('trabajoNuevoId', pm.response.json().id)
      }
    language: text/javascript
order: 2000
