$kind: http-request
url: '{{baseUrl}}/trabajos'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "Trabajo de prueba",
      "categoria": "NO_EXISTE",
      "precio_estandar": "22000.00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 400', () => pm.response.to.have.status(400))
    language: text/javascript
order: 3000
