$kind: http-request
url: '{{baseUrl}}/trabajos/{{trabajoNuevoId}}'
method: PATCH
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "Trabajo de prueba modificado {{$timestamp}}",
      "categoria": "REPARACION",
      "precio_estandar": "99999.00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200))
    language: text/javascript
order: 7000
