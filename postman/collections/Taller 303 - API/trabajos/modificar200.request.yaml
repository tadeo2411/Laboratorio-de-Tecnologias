$kind: http-request
url: '{{baseUrl}}/trabajos/{{trabajoNuevoId}}'
method: PATCH
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "orden_id": {{ordenId}},
      "tipo_trabajo_id": 1,
      "descripcion": "Realizar cambio de aceite y filtros",
      "mano_de_obra": "99999.00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200))
    language: text/javascript
order: 7000
