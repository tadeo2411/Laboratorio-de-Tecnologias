$kind: http-request
url: '{{baseUrl}}/turnos'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "id_cliente": {{clienteId}},
      "id_vehiculo": {{vehiculoId}},
      "fecha_hora": "{{turnoFecha}}",
      "duracion_min": 60,
      "motivo": "Cambio de aceite y filtros",
      "estado": "CONFIRMADO"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('turnoFecha', new Date(Date.now() + 3 * 24 * 3600 * 1000).toISOString())
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201))
      if (pm.response.code < 300) {
          pm.collectionVariables.set('turnoNuevoId', pm.response.json().id)
      }
    language: text/javascript
order: 2000
