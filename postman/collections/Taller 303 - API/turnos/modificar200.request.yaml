$kind: http-request
url: '{{baseUrl}}/turnos/{{turnoNuevoId}}'
method: PATCH
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "id_cliente": {{clienteId}},
      "id_vehiculo": {{vehiculoId}},
      "fecha_hora": "{{turnoFecha}}",
      "duracion_min": 60,
      "motivo": "Cambio",
      "estado": "CONFIRMADO"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200))
    language: text/javascript
order: 7000
