$kind: http-request
url: '{{baseUrl}}/vehiculos/{{vehiculoNuevoId}}'
method: PATCH
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "kilometraje": 160000,
      "descripcion": "Frenos cambiados"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200))
    language: text/javascript
order: 11000
