$kind: http-request
url: '{{baseUrl}}/vehiculos'
method: POST
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "patente": "12",
      "marca": "Volkswagen",
      "modelo": "Amarok",
      "anio": 2012,
      "kilometraje": 150000,
      "descripcion": "Vehiculo de prueba",
      "idCliente": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 400', () => pm.response.to.have.status(400))
    language: text/javascript
order: 4000
