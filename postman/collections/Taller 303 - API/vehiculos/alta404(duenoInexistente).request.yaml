$kind: http-request
url: "{{baseUrl}}/vehiculos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "patente": "nlp452",
      "marca": "Volkswagen",
      "modelo": "Amarok",
      "anio": 2012,
      "kilometraje": 150000,
      "descripcion": "Vehiculo de prueba",
      "idCliente": 99999999
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 404', () => pm.response.to.have.status(404))
    language: text/javascript
order: 7000
