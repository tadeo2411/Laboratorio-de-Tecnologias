$kind: http-request
url: "{{baseUrl}}/vehiculos/:id"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  id: ""
body:
  type: json
  content: |-
    {
      "kilometraje": 160000,
      "descripcion": "Frenos cambiados"
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 200', () => pm.response.to.have.status(200))
    language: text/javascript
order: 11000
