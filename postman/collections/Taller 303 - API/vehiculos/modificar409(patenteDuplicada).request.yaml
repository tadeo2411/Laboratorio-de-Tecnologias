$kind: http-request
url: "{{baseUrl}}/vehiculos/:id"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  id: ""
body:
  type: json
  content: |-
    {
      "patente": "ag 625 na"
    }
scripts:
  - type: beforeRequest
    code: |-
      // toma la patente de otro vehiculo existente
      pm.sendRequest({ url: pm.collectionVariables.get('baseUrl') + '/vehiculos/1', method: 'GET', header: { Authorization: 'Bearer ' + pm.collectionVariables.get('token') } }, (err, res) => {
          if (!err) pm.collectionVariables.set('patenteExistente', res.json().patente)
      })
    language: text/javascript
  - type: afterResponse
    code: pm.test('Responde 409', () => pm.response.to.have.status(409))
    language: text/javascript
order: 13000
